services:
  postgres:
    image: postgres:16-alpine
    container_name: hichic_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: hichic_user
      POSTGRES_PASSWORD: hichic_pass
      POSTGRES_DB: hichic_db
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hichic_user -d hichic_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: hichic_backend
    restart: unless-stopped
    env_file: ./backend/.env
    environment:
      DB_HOST: postgres
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
